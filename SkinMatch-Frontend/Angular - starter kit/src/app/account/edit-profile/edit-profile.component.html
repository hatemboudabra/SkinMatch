<div class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Modifier le Profil</h1>
      <p class="mt-2 text-gray-600">Gérez vos informations personnelles et votre photo de profil</p>
    </div>

    <!-- Alert Messages -->
    <div *ngIf="error" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
      <div class="flex">
        <lucide-angular name="alert-circle" class="h-5 w-5 text-red-400 mr-3 mt-0.5"></lucide-angular>
        <div class="text-red-800">{{ error }}</div>
      </div>
    </div>
    
    <div *ngIf="success" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
      <div class="flex">
        <lucide-angular name="check-circle" class="h-5 w-5 text-green-400 mr-3 mt-0.5"></lucide-angular>
        <div class="text-green-800">Profil mis à jour avec succès</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="bg-white shadow-lg rounded-xl overflow-hidden">
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <!-- Profile Photo Section -->
        <div class="bg-gradient-to-r from-blue-500 to-purple-600 px-6 py-8">
          <div class="flex flex-col items-center">
            <div class="relative">
              <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-lg">
                <img *ngIf="photoUrl" [src]="photoUrl" alt="Photo de profil" class="w-full h-full object-cover" />
                <div *ngIf="!photoUrl" class="w-full h-full bg-gray-200 flex items-center justify-center">
                  <lucide-angular name="user" class="h-16 w-16 text-gray-400"></lucide-angular>
                </div>
              </div>
              <label class="absolute bottom-0 right-0 bg-white rounded-full p-2 shadow-md cursor-pointer hover:bg-gray-50 transition-colors">
                <lucide-angular name="camera" class="h-5 w-5 text-gray-600"></lucide-angular>
                <input type="file" (change)="onFileChange($event)" accept="image/*" class="hidden" />
              </label>
            </div>
            <h2 class="mt-4 text-xl font-semibold text-white">{{ userDisplayName || 'Utilisateur' }}</h2>
            <p class="text-blue-100">Cliquez sur l'icône caméra pour changer votre photo</p>
          </div>
        </div>

        <!-- Form Fields -->
        <div class="p-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- First Name -->
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">
                <lucide-angular name="user" class="inline-block w-4 h-4 mr-2"></lucide-angular>
                Prénom *
              </label>
              <input 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors" 
                type="text" 
                formControlName="firstName"
                placeholder="Entrez votre prénom"
                [class.border-red-300]="form.get('firstName')?.invalid && form.get('firstName')?.touched"
              />
              <div *ngIf="form.get('firstName')?.invalid && form.get('firstName')?.touched" class="text-red-500 text-sm">
                Le prénom est requis
              </div>
            </div>

            <!-- Last Name -->
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">
                <lucide-angular name="user" class="inline-block w-4 h-4 mr-2"></lucide-angular>
                Nom *
              </label>
              <input 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors" 
                type="text" 
                formControlName="lastName"
                placeholder="Entrez votre nom"
                [class.border-red-300]="form.get('lastName')?.invalid && form.get('lastName')?.touched"
              />
              <div *ngIf="form.get('lastName')?.invalid && form.get('lastName')?.touched" class="text-red-500 text-sm">
                Le nom est requis
              </div>
            </div>

            <!-- Email -->
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">
                <lucide-angular name="mail" class="inline-block w-4 h-4 mr-2"></lucide-angular>
                Email *
              </label>
              <input 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors" 
                type="email" 
                formControlName="email"
                placeholder="Entrez votre email"
                [class.border-red-300]="form.get('email')?.invalid && form.get('email')?.touched"
              />
              <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-red-500 text-sm">
                <span *ngIf="form.get('email')?.errors?.['required']">L'email est requis</span>
                <span *ngIf="form.get('email')?.errors?.['email']">Format d'email invalide</span>
              </div>
            </div>

            <!-- Phone -->
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">
                <lucide-angular name="phone" class="inline-block w-4 h-4 mr-2"></lucide-angular>
                Téléphone
              </label>
              <input 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors" 
                type="tel" 
                formControlName="phone"
                placeholder="Entrez votre numéro de téléphone"
              />
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-end">
            <button 
              type="button" 
              class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
              (click)="router.navigate([''])"
            >
              Annuler
            </button>
            <button 
              class="px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg hover:from-blue-600 hover:to-purple-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 flex items-center justify-center" 
              type="submit" 
              [disabled]="loading || form.invalid"
            >
              <lucide-angular *ngIf="loading" name="loader-2" class="animate-spin h-5 w-5 mr-2"></lucide-angular>
              <lucide-angular *ngIf="!loading" name="save" class="h-5 w-5 mr-2"></lucide-angular>
              {{ loading ? 'Enregistrement...' : 'Enregistrer les modifications' }}
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
