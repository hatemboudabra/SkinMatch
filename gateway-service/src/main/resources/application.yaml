server:
  port: 9092

spring:
  application:
    name: gateway-service

  cloud:
    config:
      enabled: false  # Disable config server
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8084
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: http://localhost:8088
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8089/realms/SkinMatch
          jwk-set-uri: http://localhost:8089/realms/SkinMatch/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG